name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # npm ci runs the postinstall build (scripts/build.mjs), so a bundle
      # that fails its top-level-globals assertion fails CI here. dist/ is
      # gitignored, so it is not part of the syntax sweep below.
      - name: Install (builds dist/ via postinstall)
        run: npm ci

      # Sources are served concatenated + minified, never transpiled, so a
      # syntax pass over every shipped source file is still the compile check.
      - name: Syntax-check all JavaScript
        run: |
          set -e
          for f in $(git ls-files '*.js' | grep -v '^node_modules/'); do
            node --check "$f"
          done

      - name: Unit tests
        run: npm test
