name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .node-version is the single pin, shared with Render; package.json
      # "engines" bounds what it may be (Mongoose 9 / mongodb 7 need >= 20.19).
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      # npm ci runs the postinstall build (scripts/build.mjs), so a bundle
      # that fails its top-level-globals assertion fails CI here. dist/ is
      # gitignored, so it is not part of the syntax sweep below.
      - name: Install (builds dist/ via postinstall)
        run: npm ci

      # Production dependencies only (devDeps never ship to Render).
      # Level is "critical", not "high", because one high advisory cannot be
      # fixed today: cloudinary < 2.7.0 (GHSA-g4mf-96x5-5m2c), held on 1.x by
      # multer-storage-cloudinary. Trade-off: a NEW high advisory will not
      # fail CI either. Raise this to --audit-level=high once routes/upload.js
      # uses cloudinary v2 directly and multer-storage-cloudinary is gone.
      - name: Audit production dependencies (fails on critical)
        run: npm audit --omit=dev --audit-level=critical

      # Sources are served concatenated + minified, never transpiled, so a
      # syntax pass over every shipped source file is still the compile check.
      - name: Syntax-check all JavaScript (.js and .mjs)
        run: |
          set -e
          for f in $(git ls-files '*.js' '*.mjs' | grep -v '^node_modules/'); do
            node --check "$f"
          done

      - name: Unit tests
        run: npm test
