name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No build step by design (vanilla JS, raw files served as-is), so a
      # syntax pass over every shipped script is the compile check.
      - name: Syntax-check all JavaScript
        run: |
          set -e
          for f in $(git ls-files '*.js' | grep -v '^node_modules/'); do
            node --check "$f"
          done

      - name: Unit tests
        run: npm test
