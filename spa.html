<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCU Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- SPA root — views mount here -->
  <div id="app"></div>

  <!-- Shared data -->
  <script src="projects.js"></script>
  <script src="characters.js"></script>

  <!-- Core modules (order matters — these create globals) -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/state.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/popup.js"></script>
  <script src="js/friends.js"></script>
  <script src="js/memory.js"></script>
  <script src="js/walker-dialogues.js"></script>
  <script src="js/walkers.js"></script>

  <!-- Router + Views -->
  <script src="js/router.js"></script>
  <script src="js/views/login.js"></script>
  <script src="js/views/app.js"></script>
  <script src="js/views/profile.js"></script>
  <script src="js/views/characters.js"></script>

  <!-- Boot -->
  <script>
    Router.register('/', AppView);
    Router.register('/login', LoginView);
    Router.register('/profile', ProfileView);
    Router.register('/characters', CharactersView);
    Router.init('app');
  </script>
</body>

</html>
