<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MCU Tracker</title>
  <link rel="icon" type="image/jpeg" href="/assets/favicon.jpg" />
  <link rel="apple-touch-icon" href="/assets/favicon.jpg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0b0d13" />
  <!--
    Anti-flash theme boot: every app script is deferred (runs after first
    paint), so resolving the theme late would flash the wrong look without
    this. Sets data-theme before the stylesheet applies. Mirrors js/theme.js
    (the runtime API): Cinematic is the default, old 'dark' / 'light' saves
    map to Cinematic / Comic, and only an explicit 'system' choice follows
    the OS. scripts/build.mjs checks the theme-colour values match.
  -->
  <script>
    (function () {
      var t;
      try { t = localStorage.getItem('mcu-theme'); } catch (e) {}
      if (t === 'dark') t = 'cinematic';
      else if (t === 'light') t = 'comic';
      if (t === 'system') {
        t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'cinematic' : 'comic';
      } else if (t !== 'cinematic' && t !== 'comic') {
        t = 'cinematic';
      }
      document.documentElement.setAttribute('data-theme', t);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', t === 'comic' ? '#fff6d5' : '#0b0d13');
    })();
  </script>
  <!-- build:styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!--
    Display + body fonts for both themes (Cinematic: Bebas Neue, Comic:
    Bangers, both: Inter; Rajdhani until the legacy rules stop using it).
    Browsers only download the faces a page actually uses. Used to be an
    @import at the top of the stylesheet, which blocked rendering twice.
  -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Inter:wght@400..700&family=Rajdhani:wght@500;600;700&display=swap" />

  <!--
    Three.js for the 3D views. The importmap must stay inline (it has to
    exist before any module import resolves). The module that imports three
    and exposes window.THREE is js/three-shim.mjs, injected by
    js/chunk-loader.js only when the world chunk loads, so /login and the
    2D views never wait on unpkg.
  -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <!--
    Boot splash — pure HTML/CSS so it paints on first render, before any
    deferred script runs. boot.js fades it out right after Router.init
    mounts the first view. aria-hidden keeps it out of the a11y tree; the
    visible loading state is announced via the role="status" text.
  -->
  <div id="boot-splash" aria-hidden="true">
    <img class="boot-splash-logo" src="/assets/avengers-logo.svg" alt="" />
    <div class="boot-splash-bar"><span></span></div>
  </div>
  <span class="visually-hidden" role="status" id="boot-splash-status">Loading MCU Tracker…</span>

  <!-- SPA root — views mount here -->
  <div id="app"></div>

  <!--
    THIS FILE IS A TEMPLATE. scripts/build.mjs fills the two build: markers
    and writes dist/spa.html, which is what server.js serves. The app's JS is
    concatenated + minified into content-hashed chunks: a core bundle (always
    loaded, deferred) and lazy chunks — world (Three.js engine, 3D views,
    sockets, voice) and admin — that js/chunk-loader.js injects on first
    navigation. The file lists and their required order live in
    scripts/build.mjs, so adding a JS file means adding it there, not here.
  -->
  <!-- build:scripts -->
</body>

</html>
