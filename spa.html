<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MCU Tracker</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>

<body>
  <!-- SPA root — views mount here -->
  <div id="app"></div>

  <!--
    All scripts use `defer` so the browser parses the HTML without blocking
    on script download/execution. Defer preserves source order, so the
    existing script-order dependencies (config → auth → state → …) still
    hold. Scripts execute after DOMContentLoaded, which is when Router.init
    expects to run anyway.
  -->

  <!--
    Shared content. As of Phase 3 these files are CLIENT-SIDE FALLBACKS:
    boot.js fetches /api/content/* and overwrites the globals with the
    live DB values. Keeping them static means a network blip during the
    boot fetch leaves us with last-known-good content rather than blank.
    world-config.js (display geometry, not editable content) loads first
    because locations.js used to define CONFIG_WORLD inline and several
    layout modules read it before locations finishes parsing.
  -->
  <script defer src="js/world-config.js"></script>
  <script defer src="projects.js"></script>
  <script defer src="characters.js"></script>
  <script defer src="locations.js"></script>

  <!-- Core modules (order matters — these create globals) -->
  <script defer src="js/config.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/state.js"></script>
  <script defer src="js/layout.js"></script>
  <script defer src="js/utils.js"></script>
  <script defer src="js/nodeFactory.js"></script>
  <script defer src="js/renderer.js"></script>
  <script defer src="js/orderRenderer.js"></script>
  <script defer src="js/popup.js"></script>
  <script defer src="js/friends.js"></script>
  <script defer src="js/memory.js"></script>
  <script defer src="js/walker-dialogues.js"></script>
  <script defer src="js/walkerView.js"></script>
  <script defer src="js/walkers.js"></script>

  <!-- Router + Views -->
  <script defer src="js/router.js"></script>
  <script defer src="js/views/login.js"></script>
  <script defer src="js/views/app.js"></script>
  <script defer src="js/views/watchorder.js"></script>
  <script defer src="js/views/profile.js"></script>
  <script defer src="js/views/characters.js"></script>

  <!-- Admin (shell first, then tab modules append into AdminView._tabs) -->
  <script defer src="js/views/admin/index.js"></script>
  <script defer src="js/views/admin/users.js"></script>
  <script defer src="js/views/admin/moderation.js"></script>
  <script defer src="js/views/admin/config.js"></script>
  <script defer src="js/views/admin/cms.js"></script>
  <script defer src="js/views/admin/cms-projects.js"></script>
  <script defer src="js/views/admin/cms-characters.js"></script>
  <script defer src="js/views/admin/cms-locations.js"></script>
  <script defer src="js/views/admin/cms-dialogues.js"></script>
  <script defer src="js/views/admin/audit.js"></script>
  <script defer src="js/views/admin/overview.js"></script>

  <!-- Boot (also deferred via inline defer pattern — use DOMContentLoaded) -->
  <script defer src="js/boot.js"></script>
</body>

</html>
