<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Order</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <header id="header">
    <button id="nav-toggle" aria-label="Open navigation">☰</button>
    <h1>Watch Order Progression</h1>

    <!-- Navigation Drawer -->
    <div id="nav-drawer">
      <div id="nav-drawer-overlay"></div>
      <div id="nav-drawer-content">
        <button id="close-drawer" aria-label="Close navigation">✕</button>
        <nav>
          <button id="profile-btn">Profile</button>
          <button id="characters-btn">Characters</button>
          <button id="walkers-btn">Walkers</button>
          <button id="friends-btn">Friends</button>
          <button id="clear-progress">Clear Progress</button>
          <!--<button id="markAllWatchedBtn">✔ Mark All as Watched</button>-->
          <button id="logout-btn">Logout</button>
        </nav>
      </div>
    </div>
    <button id="header-profile-btn" title="Profile" aria-label="Open profile">
      <img id="header-avatar" src="" alt="" style="display:none" />
      <span id="header-avatar-initials" aria-hidden="true">👤</span>
    </button>
  </header>

  <div id="map-wrapper">
    <!-- World viewport: zoom + pan transform lives here -->
    <div id="world-viewport">
      <!-- Backdrop layers — decorative, don't scale with fight zoom but with world zoom -->
      <svg id="world-continents" aria-hidden="true" viewBox="0 0 4000 1700" preserveAspectRatio="none"></svg>
      <div id="cosmos-starfield" aria-hidden="true"></div>
      <div id="region-glows" aria-hidden="true"></div>

      <!-- Map container: fight zoom transform still mutates this -->
      <div id="map-container">
        <svg id="connections"></svg>
        <div id="nodes"></div>
        <div id="cluster-labels" aria-hidden="true"></div>
      </div>
    </div>

    <!-- World-view snap button -->
    <button id="world-view-btn" aria-label="Show world view" title="World view (W)">
      <span aria-hidden="true">🌍</span>
    </button>
  </div>

  <script src="projects.js"></script>
  <script src="characters.js"></script>
  <script src="locations.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/state.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/popup.js"></script>
  <script src="js/friends.js"></script>
  <script src="js/memory.js"></script>
  <script src="js/walker-dialogues.js"></script>
  <script src="js/walkers.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
