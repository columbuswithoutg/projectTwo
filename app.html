<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Order</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <header id="header">
    <button id="nav-toggle">☰</button>
    <h1>Watch Order Progression</h1>
    <div style="width:40px"></div> <!-- spacer to keep h1 centered -->

    <!-- Navigation Drawer -->
    <div id="nav-drawer">
      <div id="nav-drawer-overlay"></div>
      <div id="nav-drawer-content">
        <button id="close-drawer">✕</button>
        <nav>
          <button id="characters-btn">🦸 Characters</button>
          <button id="friends-btn">👥 Friends</button>
          <button id="clear-progress">🗑 Clear Progress</button>
          <!--<button id="markAllWatchedBtn">✔ Mark All as Watched</button>-->
          <button id="logout-btn">🚪 Logout</button>
        </nav>
      </div>
    </div>
  </header>

  <div id="map-wrapper">
    <div id="map-container">
      <svg id="connections"></svg>
      <div id="nodes"></div>
    </div>
  </div>

  <script src="projects.js"></script>
  <script src="characters.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/state.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/popup.js"></script>
  <script src="js/friends.js"></script>
  <script src="js/memory.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
