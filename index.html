<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MCU Tracker — Login</title>
  <link rel="icon" type="image/jpeg" href="/assets/favicon.jpg" />
  <link rel="apple-touch-icon" href="/assets/favicon.jpg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#07080f" />
  <!-- Anti-flash theme boot — same inline snippet as spa.html; see js/theme.js. -->
  <script>
    (function () {
      var t;
      try { t = localStorage.getItem('mcu-theme'); } catch (e) {}
      if (t === 'system') {
        t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      } else if (t !== 'light' && t !== 'dark') {
        t = 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', t === 'dark' ? '#07080f' : '#ffffff');
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-page">

  <div class="auth-modal-static">
    <div class="auth-box">
      <h1>MCU Watch Order</h1>
      <p class="auth-subtitle">Track your Marvel journey</p>

      <!-- Tab switcher -->
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Login</button>
        <button class="auth-tab" data-tab="register">Register</button>
      </div>

      <label for="auth-username" class="visually-hidden">Username</label>
      <input id="auth-username" type="text" placeholder="Username" autocomplete="username" />
      <label for="auth-password" class="visually-hidden">Password</label>
      <input id="auth-password" type="password" placeholder="Password" autocomplete="current-password" />
      <p class="auth-error" role="alert"></p>
      <button id="auth-submit">Login</button>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
